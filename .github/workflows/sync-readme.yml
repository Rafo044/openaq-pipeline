name: Sync README.md from docs/index.md

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Copy docs/index.md to README.md
        run: |
          python <<'PYCODE'
          import os
          import re

          index = "docs/index.md"
          readme = "README.md"

          if not os.path.exists(index):
              print("⚠️  docs/index.md not found, skipping.")
              exit(0)

          lines = []
          with open(index, "r", encoding="utf-8") as f:
              for line in f:
                  # ./images və ya images ilə başlayan yolları ./docs/images ilə əvəz et
                  line = re.sub(r'\]\((?:\.\/)?images/', '](./docs/images/', line)
                  lines.append(line)

          with open(readme, "w", encoding="utf-8") as f:
              f.writelines(lines)
          print("README.md updated from docs/index.md")
          PYCODE

      - name: Commit and push if changed
        shell: bash
        run: |
          set -e
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          CHANGED=$(git diff --name-only README.md)
          if [ -n "$CHANGED" ]; then
            git add README.md
            git commit -m "Update README.md from docs/index.md"
            git push
            echo "Changes committed and pushed."
          else
            echo "No changes to commit."
          fi
