name: Sync README.md from docs/index.md

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Copy docs/index.md to README.md
        run: |
          python <<'PYCODE'
          import os, re

          INDEX = "docs/index.md"
          README = "README.md"

          if not os.path.exists(INDEX):
              print("docs/index.md not found. Exiting.")
              exit(0)

          with open(INDEX, "r", encoding="utf-8") as f:
              content = f.read()

          # Adjust image paths for GitHub rendering
          content_fixed = re.sub(r'\]\(\./images/', '](./docs/images/', content)

          with open(README, "w", encoding="utf-8") as f:
              f.write(content_fixed)

          print("README.md updated from docs/index.md")
          PYCODE

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "Update README.md from docs/index.md"
            git push
            echo "Changes pushed to repository."
          else
            echo "No changes to commit."
