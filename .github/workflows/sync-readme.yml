name: Sync README.md from docs/index.md

on:
  push:
    branches: [main]
    paths:
      - "docs/index.md"

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' && github.actor != 'github-actions' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Copy docs/index.md to README.md
        run: |
          python <<'PYCODE'
          import os
          import re

          index = "docs/index.md"
          readme = "README.md"

          if not os.path.exists(index):
              print("⚠️  docs/index.md not found, skipping.")
              exit(0)

          lines = []
          with open(index, "r", encoding="utf-8") as f:
              for line in f:
                  line = re.sub(r'\]\((?:\.\/)?images/', '](./docs/images/', line)
                  lines.append(line)

          with open(readme, "w", encoding="utf-8") as f:
              f.writelines(lines)

          print("✅ README.md updated from docs/index.md (all lines processed)")
          PYCODE

      - name: Commit and push if changed
        shell: bash
        run: |
          set -e
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # check if README.md content changed compared to HEAD
          if ! git diff --quiet -- README.md; then
            git add README.md
            # optional: include a tag in commit message to make it obvious it was auto-generated
            git commit -m "chore: Sync README.md from docs/index.md [auto-sync]"
            # use --force-with-lease only if you understand implications; normal push should be fine
            git push
            echo "Changes committed and pushed."
          else
            echo "No changes to commit."
          fi
