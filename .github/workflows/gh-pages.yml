name: Deploy Sites to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ----- Datalineage (Node.js) -----
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies (Datalineage)
        run: npm install
        working-directory: datalineage

      - name: Build Datalineage
        run: npm run build
        working-directory: datalineage

      # ----- Docs (MkDocs, Python) -----
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install MkDocs and theme
        run: |
          pip install mkdocs==1.6.1
          pip install mkdocs-bootswatch

      - name: Build MkDocs site
        run: mkdocs build
        working-directory: .

      # ----- Combine both outputs -----
      - name: Prepare deployment folder
        run: |
          mkdir public
          mkdir -p public/datalineage
          mkdir -p public/docs
          cp -r datalineage/dist/* public/datalineage/
          cp -r site/* public/docs/

      # ----- Deploy both -----
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
