name: Deploy Sites to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ----- Datalineage (Vite, Node.js) -----
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies (Datalineage)
        run: npm install
        working-directory: datalineage

      - name: Build Datalineage
        run: npm run build
        working-directory: datalineage

      # ----- MCDocs (Python) -----
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install MCDocs
        run: pip install mcdocs

      - name: Build MCDocs site
        run: mcdocs build
        working-directory: docs

      # ----- Deploy both sites -----
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: |
            datalineage/dist
            docs/build
