name: Deploy Multiple Sites to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ----- Datalineage site -----
      - name: Setup Node.js for Datalineage
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies (Datalineage)
        run: npm install
        working-directory: datalineage

      - name: Build Vite project (Datalineage)
        run: npm run build
        working-directory: datalineage

      # ----- MCDocs site -----
      - name: Setup Node.js for MCDocs
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies (MCDocs)
        run: npm install
        working-directory: docs

      - name: Build MCDocs site
        run: npx mcdocs build
        working-directory: docs

      # ----- Deploy both sites -----
      - name: Deploy both sites to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: |
            datalineage/dist
            docs/build
